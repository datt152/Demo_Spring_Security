<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #3498db;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #2980b9;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #27ae60;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-links button {
            margin-right: 6px;
            padding: 4px 8px;
            font-size: 0.9em;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-links button:hover {
            background-color: #2980b9;
        }

        .action-links button.remove {
            background-color: #e74c3c;
        }

        .action-links button.remove:hover {
            background-color: #c0392b;
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #27ae60;
        }

        .checkout-btn {
            display: inline-block;
            margin-top: 15px;
            background-color: #27ae60;
            padding: 10px 20px;
            font-size: 1.1em;
        }

        .checkout-btn:hover {
            background-color: #1e8449;
        }

        .empty-cart {
            padding: 20px;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            margin: 20px 0;
        }

        input[type="number"] {
            width: 60px;
            padding: 4px;
        }

        .flash-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<h1>🛒 Giỏ hàng của bạn</h1>

<!-- Flash messages -->
<div th:if="${success}" class="flash-message flash-success">
    <span th:text="${success}"></span>
</div>
<div th:if="${error}" class="flash-message flash-error">
    <span th:text="${error}"></span>
</div>

<div th:if="${cart.empty}" class="empty-cart">
    <p>Giỏ hàng của bạn đang trống!</p>
</div>

<div th:unless="${cart.empty}">
    <table>
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
            <td th:text="${item.productName}"></td>
            <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')} + '₫'"></td>
            <td>
                <form th:action="@{/cart/update}" method="post" style="display: inline;">
                    <input type="hidden" name="productId" th:value="${item.productId}"/>
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1"/>
                    <button type="submit" style="margin-left: 5px;">Cập nhật</button>
                </form>
            </td>
            <td th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 2, 'POINT')} + '₫'"></td>
            <td class="action-links">
                <form th:action="@{/cart/remove}" method="post" style="display: inline;">
                    <input type="hidden" name="productId" th:value="${item.productId}"/>
                    <button type="submit" class="remove">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        <p>Tổng cộng: <span th:text="${#numbers.formatDecimal(cart.total, 0, 'COMMA', 2, 'POINT')} + '₫'"></span></p>
    </div>

    <form th:action="@{/cart/checkout}" method="post" style="display: inline;">
        <button type="submit" class="checkout-btn" style="border: none; cursor: pointer;">✅ Thanh toán</button>
    </form>
</div>

<br/>
<a th:href="@{/products}">⬅ Tiếp tục mua sắm</a>

</body>
</html>
