<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Chi tiết đơn hàng</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .order-detail {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        .order-detail p {
            font-size: 1.1em;
            margin: 10px 0;
        }

        .order-detail b {
            color: #34495e;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #27ae60;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
        }

        a.back {
            color: #3498db;
        }

        a.edit {
            color: #27ae60;
        }

        a.delete {
            color: #e74c3c;
        }

        a:hover {
            opacity: 0.8;
        }

        .order-actions {
            margin-top: 15px;
        }
    </style>
</head>
<body>
<h1>Chi tiết đơn hàng</h1>

<div class="order-detail">
    <p><b>ID:</b> <span th:text="${order.id}"></span></p>
    <p><b>Ngày tạo:</b> <span th:text="${#dates.format(order.date.time, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><b>Khách hàng:</b> <span th:text="${order.customer.name}"></span></p>

    <h3>Chi tiết sản phẩm</h3>
    <table>
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Số lượng</th>
            <th>Giá mua</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${orderLines}">
            <td th:text="${line.product.name}"></td>
            <td th:text="${line.amount}"></td>
            <td th:text="${#numbers.formatDecimal(line.purchasePrice,0,'COMMA',2,'POINT')} + '₫'"></td>
        </tr>
        </tbody>
    </table>
</div>

<div class="order-actions">
    <a th:href="@{/orders}" class="back">⬅ Quay lại danh sách</a>

    <a th:href="@{'/orders/delete/' + ${order.id}}" sec:authorize="hasRole('ADMIN')" class="delete">🗑 Xóa</a>
</div>
</body>
</html>
