<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Đơn hàng của tôi</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #27ae60;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #1e8449;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #27ae60;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-links a {
            margin-right: 6px;
            padding: 4px 8px;
            font-size: 0.9em;
            background-color: #3498db;
        }

        .action-links a:hover {
            background-color: #2980b9;
        }

        .no-orders {
            padding: 20px;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            margin: 20px 0;
        }

        .flash-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<h1>📦 Đơn hàng của tôi</h1>

<!-- Flash messages -->
<div th:if="${success}" class="flash-message flash-success">
    <span th:text="${success}"></span>
</div>
<div th:if="${error}" class="flash-message flash-error">
    <span th:text="${error}"></span>
</div>

<div th:if="${#lists.isEmpty(orders)}" class="no-orders">
    <p>Bạn chưa có đơn hàng nào!</p>
</div>

<table th:unless="${#lists.isEmpty(orders)}">
    <thead>
    <tr>
        <th>Mã đơn hàng</th>
        <th>Ngày tạo</th>
        <th>Khách hàng</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${#dates.format(order.date.time, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${order.customer.name}"></td>
        <td class="action-links">
            <a th:href="@{'/my/orders/' + ${order.id}}">Chi tiết</a>
        </td>
    </tr>
    </tbody>
</table>

<br/>
<a th:href="@{/home}">⬅ Quay lại trang chủ</a>
</body>
</html>
